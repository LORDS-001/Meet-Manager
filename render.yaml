# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploy:
#   1. Push this file to the repo.
#   2. Render dashboard -> New -> Blueprint -> pick this repository.
#   3. Fill in the env vars marked `sync: false` (Render prompts for them).
#   4. After the first deploy, copy the service URL into PUBLIC_URL and add
#      "<PUBLIC_URL>/auth/callback" to the Google OAuth client's authorised
#      redirect URIs. Redeploy.
#
# READ THIS BEFORE GOING PUBLIC
# ----------------------------
# MeetManager is multi-tenant: every row carries an owner, signing in with
# Google creates the account, and one account cannot reach another's data.
# Two things still gate who can actually get in, and neither lives in this
# file - both are set on the Google OAuth client:
#   * while the consent screen is in "Testing", only listed test users can
#     sign in at all, and their tokens expire after 7 days;
#   * published-but-unverified allows any Google account, shows a warning
#     interstitial, and caps you at 100 users.
# See "Letting other people sign in" in README.md.

services:
  - type: web
    name: meetmanager
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt          # nearest to Africa/Lagos; change if you prefer
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true

    # NOTE ON THE FREE PLAN
    # ---------------------
    # Free instances cannot mount a persistent disk, and their filesystem is
    # reset whenever the service restarts - which includes spinning back up
    # after 15 minutes of inactivity. Everything here lives in SQLite under
    # /app/data, so on this plan expect:
    #   * every user is signed out and must reconnect Google after a restart;
    #   * cached events and locally-created tasks are lost (Google-sourced
    #     data returns on the next sync, local tasks do not);
    #   * reminders do not fire while the service is asleep.
    # Fine for demonstrating the app. To run it for real, either switch to
    # `plan: starter` and add the disk block below, or point the store at a
    # managed Postgres.
    #
    # disk:
    #   name: meetmanager-data
    #   mountPath: /app/data
    #   sizeGB: 1

    envVars:
      # The public address of this service, e.g. https://meetmanager.onrender.com
      # Without it the OAuth redirect is derived from HOST/PORT and comes out
      # as http://0.0.0.0:10000/auth/callback, which Google rejects.
      - key: PUBLIC_URL
        sync: false

      # Signs the session cookie. Render generates one once and keeps it, so
      # a redeploy does not sign everybody out. Left unset, the app generates
      # a key per boot and stores it - which an ephemeral disk then throws away.
      - key: SECRET_KEY
        generateValue: true

      # Your OAuth client. credentials.json is deliberately not in the repo,
      # so on a host these two are the only way to configure it.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Optional. Cosmetic only now that accounts exist: a default address for
      # an install nobody has signed into yet. Users are identified by their
      # own Google sign-in, never by this.
      - key: OWNER_EMAIL
        sync: false

      - key: TIMEZONE
        value: Africa/Lagos
      - key: REMINDER_MINUTES
        value: "30"
      - key: SYNC_INTERVAL_SECONDS
        value: "300"

      # Optional e-mail reminders; leave unset to disable.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
